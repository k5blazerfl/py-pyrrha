[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrrha"
version = "0.4.68"
description = "A skinnable Qt (PySide6) audio player with classic Winamp 2.x fidelity — Pandora radio and local files; built on Pithos' core"
readme = "pyrrha/README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Pyrrha contributors" }]
keywords = ["pandora", "radio", "music", "qt", "pyside6"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

# Runtime dependencies. PyGObject + GStreamer + libsecret introspection are
# expected from the system (the project's venv is created with
# --system-site-packages); listing PyGObject here is satisfied by that.
dependencies = [
    "PySide6-Essentials>=6.5",
    "PyGObject",
    # Tolerant fallback decoder for skin bitmaps Qt's loader rejects (odd BMP
    # variants, or PNG/GIF saved under a .bmp name). Optional at runtime — the
    # skin loader degrades gracefully if it's missing — but listed so the wider
    # skin-compatibility path is reliably available.
    "Pillow",
]

[project.optional-dependencies]
lastfm = ["pylast"]
journald = ["systemd-python"]
tags = ["mutagen"]

[project.scripts]
pyrrha = "pyrrha.__main__:main"

[project.urls]
Homepage = "https://pithos.github.io"

[tool.setuptools.packages.find]
include = ["pyrrha*"]

[tool.setuptools.package-data]
pyrrha = [
    "icons/*.png", "data/*.desktop", "README.md",
    "skins/*/*.bmp", "skins/*/*.txt", "skins/*/*.md",
]
